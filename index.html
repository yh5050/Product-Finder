      s += '<button type="button" class="aitem"' + pressed(x.selected) + on(x.select) + '><span class="rank" aria-label="Rank ' + x.rank + '">' + x.rank + '</span><span class="avatar">' + esc(x.initials) + '</span>' +

    var body = v.scrFeed ? feedView(v) : v.scrDetail ? detailView(v) : v.scrReview ? reviewView(v) : v.scrDone ? doneView(v) : appsView(v);
    return '<div class="cstage"><div class="phone" role="region" aria-label="Creator app, mobile view">' +
      '<div class="phead"><p class="wordmark">Desk<span>side</span></p><div style="display:flex;align-items:center;gap:8px"><span class="small muted">@mayasdesk</span><span class="avatar" aria-hidden="true">MO</span></div></div>' +
      (v.showTabs ? '<nav class="ptabs" aria-label="Creator sections"><button type="button"' + pressed(v.cFeedTab) + on(v.toFeed) + '>Opportunities</button><button type="button"' + pressed(v.cAppsTab) + on(v.toApps) + '>My applications (' + v.myAppCount + ')</button></nav>' : '') +
      body + '</div>' +
      '<aside class="side" aria-label="About this view"><div class="card"><p class="eyebrow">Creator view</p><p style="font-weight:600;margin-top:6px">Mobile-first, shown at phone width</p><p class="small muted" style="margin-top:6px">Signed in as Maya Okafor, a fictional desk-setup creator: TikTok, 24.8K followers (self-reported), 4 videos in the past 90 days.</p></div>' +
      '<div class="card"><p class="eyebrow">Application status</p><p style="margin-top:8px"><span class="st ' + v.kbStClass + '">' + esc(v.kbStLabel) + '</span></p><p class="small muted" style="margin-top:8px">Keyboard brief from Halden Works. Updates when the brand acts.</p></div></aside></div>';
  }

  // ---- mount ----
  var root = document.getElementById('root');
  var comp = new Component({});
  var lastScreen = '';
  window.__dcRender = function () {
    var ae = document.activeElement, fid = ae && ae.id, ss = null, se = null;
    try { if (fid && ae.selectionStart != null) { ss = ae.selectionStart; se = ae.selectionEnd; } } catch (e) {}
    H = [];
    var v = comp.renderVals();
    var html = demobar(v) + '<div class="sr" aria-live="polite">' + esc(v.toast) + '</div>' +
      (v.hasToast ? '<div class="toast" role="status"><span>' + esc(v.toast) + '</span><button type="button" aria-label="Dismiss message"' + on(v.closeToast) + '>Dismiss</button></div>' : '') +
      (v.isBrand ? brand(v) : creator(v));
    root.innerHTML = html;
    var screen = comp.state.role + comp.state.bTab + comp.state.cScr + comp.state.listing;
    if (screen !== lastScreen && lastScreen) window.scrollTo(0, 0);
    lastScreen = screen;
    if (fid) { var el = document.getElementById(fid); if (el) { el.focus(); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) {} } }
  };
  function fire(e) {
    var t = e.target.closest('[data-h]'); if (!t) return;
    var fn = H[Number(t.getAttribute('data-h'))]; if (!fn) return;
    var tag = t.tagName;
    if (e.type === 'click' && (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA')) return;
    if (e.type === 'input' && !(tag === 'INPUT' || tag === 'TEXTAREA')) return;
    if (e.type === 'change' && tag !== 'SELECT' && !(tag === 'INPUT' && t.type === 'radio')) return;
    fn(e);
  }
  root.addEventListener('click', fire);
  root.addEventListener('input', fire);
  root.addEventListener('change', fire);
  window.__dcRender();
})();

</script>
</body>
